services:
  rippl3fx:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - rippl3fx-data:/data
    environment:
      - DATA_DIR=/data
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - PORT=${PORT:-3000}
      - TZ=${TZ:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}

volumes:
  rippl3fx-data:
